<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Страница закрыта</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
    }

    .card {
      width: min(90%, 500px);
      padding: 45px 25px;
      text-align: center;
      background: rgba(255, 255, 255, 0.92);
      border-radius: 25px;
      box-shadow: 0 15px 40px rgba(150, 30, 70, 0.25);
      animation: appear 0.8s ease;
    }

    h1 {
      margin: 0 0 20px;
      color: #e91e63;
      font-size: clamp(28px, 7vw, 48px);
    }

    p {
      margin: 0;
      color: #6d4050;
      font-size: clamp(18px, 4vw, 24px);
      line-height: 1.5;
    }

    .heart {
      position: fixed;
      bottom: -40px;
      z-index: -1;
      color: #ff2f6d;
      font-size: 24px;
      pointer-events: none;
      animation: flyUp linear forwards;
    }

    @keyframes flyUp {
      0% {
        transform: translateY(0) rotate(0deg) scale(0.8);
        opacity: 0;
      }
      15% {
        opacity: 1;
      }
      100% {
        transform: translateY(-110vh) rotate(360deg) scale(1.5);
        opacity: 0;
      }
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: scale(0.7);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }
  </style>
</head>

<body>
  <main class="card">
    <h1>Страница закрыта 💔</h1>
    <p>Спасибо за честность. Я всё понял и больше не буду тебя беспокоить.</p>
  </main>

  <script>
    function createHeart() {
      const heart = document.createElement("div");
      heart.className = "heart";
      heart.textContent = Math.random() > 0.5 ? "❤️" : "💖";
      heart.style.left = `${Math.random() * 100}vw`;
      heart.style.fontSize = `${18 + Math.random() * 25}px`;
      heart.style.animationDuration = `${3 + Math.random() * 4}s`;
      document.body.appendChild(heart);

      setTimeout(() => heart.remove(), 7000);
    }

    setInterval(createHeart, 900);
  </script>
</body>
</html>
