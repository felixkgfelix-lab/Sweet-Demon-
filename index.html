<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Вопросик ❤️</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
    }

    .card {
      position: relative;
      z-index: 2;
      width: min(90%, 500px);
      padding: 45px 25px;
      text-align: center;
      background: rgba(255, 255, 255, 0.9);
      border-radius: 25px;
      box-shadow: 0 15px 40px rgba(150, 30, 70, 0.25);
      animation: appear 1s ease;
    }

    h1 {
      margin: 0 0 30px;
      color: #e91e63;
      font-size: clamp(28px, 7vw, 48px);
    }

    .buttons {
      position: relative;
      min-height: 100px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
    }

    button {
      border: none;
      border-radius: 50px;
      padding: 14px 28px;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      transition:
        transform 0.3s ease,
        left 0.3s ease,
        top 0.3s ease,
        font-size 0.3s ease;
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.15);
    }

    #yesButton {
      background: #e91e63;
      z-index: 3;
    }

    #noButton {
      background: #777;
      z-index: 4;
    }

    .message {
      display: none;
      color: #e91e63;
      font-size: clamp(25px, 6vw, 40px);
      font-weight: bold;
      line-height: 1.3;
      animation: messageAppear 0.8s ease;
    }

    .heart {
      position: fixed;
      bottom: -40px;
      z-index: 1;
      color: #ff2f6d;
      font-size: 24px;
      pointer-events: none;
      animation: flyUp linear forwards;
    }

    @keyframes flyUp {
      0% {
        transform: translateY(0) rotate(0deg) scale(0.8);
        opacity: 0;
      }

      15% {
        opacity: 1;
      }

      100% {
        transform: translateY(-110vh) rotate(360deg) scale(1.5);
        opacity: 0;
      }
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: scale(0.7);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes messageAppear {
      from {
        opacity: 0;
        transform: scale(0.3) rotate(-10deg);
      }

      to {
        opacity: 1;
        transform: scale(1) rotate(0);
      }
    }
  </style>
</head>

<body>
  <div class="card">
    <div id="questionBlock">
      <h1>Ты меня любишь? 💖</h1>

      <div class="buttons">
        <button id="yesButton">Да ❤️</button>
        <button id="noButton">Нет 🙈</button>
      </div>
    </div>

    <div id="message" class="message">
      А как мило, так и знал! 🥰💖
    </div>
  </div>

  <script>
    const noButton = document.getElementById("noButton");
    const yesButton = document.getElementById("yesButton");
    const questionBlock = document.getElementById("questionBlock");
    const message = document.getElementById("message");

    let noClicks = 0;
    let yesScale = 1;

    function moveNoButton() {
      noClicks++;

      // Увеличиваем кнопку «Да»
      yesScale += 0.18;
      yesButton.style.transform = `scale(${yesScale})`;

      // Переводим кнопку «Нет» в fixed-позиционирование
      noButton.style.position = "fixed";

      const buttonWidth = noButton.offsetWidth;
      const buttonHeight = noButton.offsetHeight;

      const maxX = window.innerWidth - buttonWidth - 15;
      const maxY = window.innerHeight - buttonHeight - 15;

      const randomX = Math.max(15, Math.random() * maxX);
      const randomY = Math.max(15, Math.random() * maxY);

      noButton.style.left = `${randomX}px`;
      noButton.style.top = `${randomY}px`;

      // После нескольких нажатий кнопка становится ещё меньше
      if (noClicks >= 4) {
        noButton.style.transform = "scale(0.8)";
      }

      createHeart();
    }

    // Работает и на компьютере, и на телефоне
    noButton.addEventListener("mouseenter", moveNoButton);
    noButton.addEventListener("touchstart", (event) => {
      event.preventDefault();
      moveNoButton();
    });

    noButton.addEventListener("click", moveNoButton);

    yesButton.addEventListener("click", () => {
      questionBlock.style.display = "none";
      message.style.display = "block";

      // Создаём много сердечек после нажатия
      for (let i = 0; i < 35; i++) {
        setTimeout(createHeart, i * 100);
      }
    });

    function createHeart() {
      const heart = document.createElement("div");
      heart.className = "heart";
      heart.textContent = Math.random() > 0.5 ? "❤️" : "💖";

      heart.style.left = `${Math.random() * 100}vw`;
      heart.style.fontSize = `${18 + Math.random() * 25}px`;
      heart.style.animationDuration = `${3 + Math.random() * 4}s`;

      document.body.appendChild(heart);

      setTimeout(() => {
        heart.remove();
      }, 7000);
    }

    // Постоянно запускаем летающие сердечки
    setInterval(createHeart, 700);
  </script>
</body>
</html>
