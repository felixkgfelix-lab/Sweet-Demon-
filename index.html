<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Друзья</title>
  <style>
    :root {
      --bg1: #ffe4ec;
      --bg2: #f9d9d9;
      --bg3: #f3c9d6;
      --card: rgba(255, 255, 255, 0.7);
      --text: #5f2c3a;
      --accent: #ec6d96;
      --accent-2: #f7b6c8;
      --line: rgba(255, 255, 255, 0.6);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, var(--bg1), var(--bg2), var(--bg3));
      color: var(--text);
    }

    body {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      position: relative;
      z-index: 5;
      width: min(92vw, 700px);
      padding: 36px 28px 28px;
      border-radius: 30px;
      background: var(--card);
      border: 1px solid rgba(255,255,255,0.6);
      box-shadow: 0 18px 50px rgba(158, 74, 102, 0.18);
      backdrop-filter: blur(8px);
      animation: cardFade 1.3s ease forwards;
      text-align: center;
    }

    .badge {
      display: inline-block;
      margin-bottom: 18px;
      padding: 8px 18px;
      border-radius: 999px;
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-weight: 700;
      background: rgba(236, 109, 150, 0.12);
      color: var(--accent);
    }

    .text {
      min-height: 150px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(22px, 4vw, 38px);
      line-height: 1.5;
      font-weight: 700;
      letter-spacing: 0.02em;
      color: var(--text);
      text-shadow: 0 2px 10px rgba(255, 255, 255, 0.4);
    }

    .typed {
      display: inline;
      white-space: pre-wrap;
      word-break: break-word;
      animation: textGlow 2s ease-in-out infinite alternate;
    }

    .cursor {
      display: inline-block;
      width: 2px;
      height: 1.1em;
      background: var(--accent);
      vertical-align: middle;
      margin-left: 4px;
      animation: blink 0.8s infinite;
    }

    .footer {
      margin-top: 20px;
      font-size: 14px;
      letter-spacing: 0.03em;
      color: rgba(95, 44, 58, 0.7);
      opacity: 0;
      animation: showFooter 1.2s ease 3.5s forwards;
    }

    .petal,
    .mini-heart,
    .rain-drop {
      position: fixed;
      pointer-events: none;
      z-index: 1;
    }

    .petal {
      width: 16px;
      height: 16px;
      background: linear-gradient(135deg, #ffd9e5, #f7a8ba);
      border-radius: 0 100% 0 100%;
      transform: rotate(45deg);
      box-shadow: 0 0 10px rgba(255, 170, 200, 0.5);
      opacity: 0.8;
      animation: fall linear forwards;
    }

    .petal::before {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(255,255,255,0.18);
      border-radius: 0 100% 0 100%;
    }

    .mini-heart {
      font-size: 12px;
      opacity: 0;
      animation: heartFade linear forwards;
      filter: drop-shadow(0 0 8px rgba(236, 109, 150, 0.5));
    }

    .rain-drop {
      width: 2px;
      height: 26px;
      background: linear-gradient(to bottom, rgba(255,255,255,0.2), rgba(184, 217, 255, 0.8));
      border-radius: 999px;
      animation: rainFall linear forwards;
      opacity: 0.4;
    }

    @keyframes cardFade {
      from { opacity: 0; transform: translateY(18px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    @keyframes textGlow {
      from { text-shadow: 0 0 0 rgba(236,109,150,0); }
      to { text-shadow: 0 0 18px rgba(236,109,150,0.25); }
    }

    @keyframes showFooter {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fall {
      0% {
        transform: translate3d(0, -20px, 0) rotate(0deg) scale(0.8);
        opacity: 0;
      }
      15% { opacity: 0.9; }
      100% {
        transform: translate3d(var(--drift, 30px), 110vh, 0) rotate(360deg) scale(1.1);
        opacity: 0;
      }
    }

    @keyframes heartFade {
      0% {
        transform: translateY(0) scale(0.5);
        opacity: 0;
      }
      15% { opacity: 1; }
      60% { opacity: 1; }
      100% {
        transform: translateY(-100px) scale(1.5) rotate(15deg);
        opacity: 0;
      }
    }

    @keyframes rainFall {
      0% {
        transform: translateY(-30px) scaleY(0.8);
        opacity: 0;
      }
      20% { opacity: 0.5; }
      100% {
        transform: translateY(110vh) scaleY(1.2);
        opacity: 0;
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">кстати</div>
    <div class="text">
      <span class="typed" id="typedText"></span><span class="cursor"></span>
    </div>
    <div class="footer">давай оставим всё как есть — и всё равно будем друзьями</div>
  </div>

  <script>
    const text = "давай мы останемся тогда как настоящие друзья... алло, привет, как дела? всё равно ничего не изменится";
    const typedText = document.getElementById("typedText");
    let index = 0;

    function typeWriter() {
      if (index < text.length) {
        typedText.textContent += text[index];
        index++;
        setTimeout(typeWriter, 55);
      }
    }

    setTimeout(typeWriter, 600);

    function createPetal() {
      const petal = document.createElement("div");
      petal.className = "petal";
      petal.style.left = `${Math.random() * 100}vw`;
      petal.style.animationDuration = `${8 + Math.random() * 6}s`;
      petal.style.setProperty("--drift", `${-60 + Math.random() * 120}px`);
      petal.style.opacity = (0.4 + Math.random() * 0.6).toString();
      document.body.appendChild(petal);
      setTimeout(() => petal.remove(), 15000);
    }

    function createHeart() {
      const heart = document.createElement("div");
      heart.className = "mini-heart";
      heart.textContent = Math.random() > 0.5 ? "❤️" : "💗";
      heart.style.left = `${Math.random() * 100}vw`;
      heart.style.top = `${Math.random() * 70 + 25}vh`;
      heart.style.fontSize = `${10 + Math.random() * 14}px`;
      heart.style.animationDuration = `${2.5 + Math.random() * 3.5}s`;
      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 5000);
    }

    function createRain() {
      const drop = document.createElement("div");
      drop.className = "rain-drop";
      drop.style.left = `${Math.random() * 100}vw`;
      drop.style.animationDuration = `${1.1 + Math.random() * 1.4}s`;
      document.body.appendChild(drop);
      setTimeout(() => drop.remove(), 2500);
    }

    setInterval(createPetal, 700);
    setInterval(createHeart, 500);
    setInterval(createRain, 200);
  </script>
</body>
</html>
